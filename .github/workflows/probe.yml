name: Probe the runner

# One-off measurements for designing the judge: how long Lean v4.36.0 takes to build from source on
# the 4-core runner, how long the workload takes, whether exports are byte-identical across builds,
# and whether hardware counters (perf) work here.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: clean builds of the workload per toolchain
        default: "2"

permissions:
  contents: read

env:
  LEAN_TAG: v4.36.0
  CEDAR_REV: 0e8c45ca4e920ebe78b6bc705263a0b56467bb66
  BATTERIES_REV: b4b25a3886a16daacaf6615c2eea7170a6e8f458
  EXPORT_REV: df81913eee5519d5a88ae5b0fd701b5298cc29ab

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Machine
        run: |
          nproc; free -g; df -h /; lscpu | sed -n '1,25p'
          echo "machine: $(nproc) cpus, $(lscpu | sed -n 's/^Model name: *//p')" >> "$GITHUB_STEP_SUMMARY"

      - name: Hardware counters
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" >/dev/null 2>&1 || echo "no linux-tools for $(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          perf stat -e instructions,cycles,task-clock -- ls / 2>&1 | tail -12 || true
          { echo '```'; perf stat -e instructions,task-clock -- ls / 2>&1 | tail -8; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Free disk space and install build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get install -yq git libgmp-dev libuv1-dev libssl-dev cmake ccache clang pkgconf time zstd >/dev/null
          clang --version | head -1; cmake --version | head -1; dpkg -s libgmp-dev | grep Version

      - name: Build Lean from source
        run: |
          git clone -q --depth 1 --branch "$LEAN_TAG" https://github.com/leanprover/lean4 lean4
          cd lean4
          cmake --preset release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > ../cmake.log 2>&1 || { tail -50 ../cmake.log; exit 1; }
          start=$(date +%s)
          /usr/bin/time -v -o ../lean-build.time make -C build/release -j"$(nproc)" > ../lean-build.log 2>&1 || { tail -80 ../lean-build.log; exit 1; }
          end=$(date +%s)
          ls build/release/stage1/bin
          ./build/release/stage1/bin/lean --version
          grep -E 'Elapsed|Maximum resident|User time|System time' ../lean-build.time
          echo "lean $LEAN_TAG from source: $(( (end - start) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the workload and the exporter
        run: |
          fetch() { mkdir -p "$2" && git -C "$2" init -q && git -C "$2" fetch -q --depth 1 "https://github.com/$1" "$3" && git -C "$2" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          fetch cedar-policy/cedar-spec cedar "$CEDAR_REV"
          fetch leanprover-community/batteries cedar/cedar-lean/.lake/packages/batteries "$BATTERIES_REV"
          fetch leanprover/lean4export lean4export "$EXPORT_REV"
          cp -r cedar/cedar-lean pristine
          echo "cedar: $(find pristine/Cedar -name '*.lean' | wc -l) files, $(find pristine/Cedar -name '*.lean' | xargs cat | wc -l) lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the exporter with the source-built Lean
        run: |
          export PATH="$PWD/lean4/build/release/stage1/bin:$PATH"
          cd lean4export && echo "leanprover/lean4:$LEAN_TAG" > lean-toolchain && lake build 2>&1 | tail -5
          ls -l .lake/build/bin/

      - name: Workload, source-built Lean
        run: |
          export PATH="$PWD/lean4/build/release/stage1/bin:$PATH"
          for r in $(seq 1 "${{ inputs.rounds }}"); do
            rm -rf run && cp -r pristine run && cd run
            start=$(date +%s.%N)
            /usr/bin/time -v -o ../src-$r.time lake build +Cedar > ../src-$r.log 2>&1 || { tail -60 ../src-$r.log; exit 1; }
            end=$(date +%s.%N)
            secs=$(python3 -c "print(round($end - $start, 1))")
            grep -E 'Elapsed|Maximum resident|User time|System time' ../src-$r.time
            estart=$(date +%s)
            lake env ../lean4export/.lake/build/bin/lean4export Cedar > ../src-$r.ndjson
            eend=$(date +%s)
            sum=$(sha256sum ../src-$r.ndjson | cut -c1-16)
            echo "source-built round $r: build ${secs}s, $(grep 'User time' ../src-$r.time), export $((eend - estart))s, $(stat -c %s ../src-$r.ndjson) bytes, sha256 $sum" | tee -a "$GITHUB_STEP_SUMMARY"
            cd ..
          done
          sha256sum src-*.ndjson

      - name: Workload, the released v4.36.0 binaries
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "leanprover/lean4:$LEAN_TAG" >/dev/null
          TC="$HOME/.elan/toolchains/leanprover--lean4---$LEAN_TAG/bin"
          export PATH="$TC:$PATH"
          lean --version
          rm -rf lean4export/.lake/build && (cd lean4export && lake build 2>&1 | tail -2)
          rm -rf run && cp -r pristine run && cd run
          start=$(date +%s.%N)
          /usr/bin/time -v -o ../rel.time lake build +Cedar > ../rel.log 2>&1 || { tail -60 ../rel.log; exit 1; }
          end=$(date +%s.%N)
          secs=$(python3 -c "print(round($end - $start, 1))")
          lake env ../lean4export/.lake/build/bin/lean4export Cedar > ../rel.ndjson
          echo "release binary: build ${secs}s, $(grep 'User time' ../rel.time), sha256 $(sha256sum ../rel.ndjson | cut -c1-16)" | tee -a "$GITHUB_STEP_SUMMARY"
          cd .. && sha256sum *.ndjson

      - name: Instructions for one build, if counters work
        continue-on-error: true
        run: |
          export PATH="$PWD/lean4/build/release/stage1/bin:$PATH"
          rm -rf run && cp -r pristine run && cd run
          perf stat -e instructions,task-clock -o ../perf.txt -- lake build +Cedar > /dev/null 2>&1
          cat ../perf.txt
          { echo '```'; cat ../perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Diff the exports
        if: always()
        run: |
          ls -l *.ndjson || true
          for f in src-2.ndjson rel.ndjson; do [ -f "$f" ] && { cmp src-1.ndjson "$f" && echo "$f identical to src-1" || { echo "$f differs"; diff <(head -c 200000000 src-1.ndjson) <(head -c 200000000 "$f") | head -40; }; } || true; done
